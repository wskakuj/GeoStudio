<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="api-token" content="__GEOSTUDIO_LOCAL_TOKEN__">
<title>GeoStudio 2.0</title>
<link rel="stylesheet" href="/tabs.css">
<script defer src="/tabs.js"></script>
</head>
<body>
<header class="tabs-bar">
  <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m3 8 9-5 9 5-9 5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></span>
  <span class="brand">GeoStudio <small>2.0</small></span>
  <button type="button" id="app-version" class="version-badge" title="Kliknij, aby sprawdzić aktualizacje">v—</button>
  <button type="button" id="auth-logout" hidden>Wyloguj</button>
  <div id="tab-list" class="tabs" role="tablist" aria-label="Otwarte mapy"></div>
  <button id="add-tab" type="button" title="Nowa zakładka mapy" aria-label="Nowa zakładka mapy">+</button>
  <span id="tab-count" class="tab-count"></span>
</header>
<div id="auth-notice" hidden>
  <span id="auth-message" role="status"></span>
  <button type="button" id="auth-save-copy" hidden>Zapisz kopię aktywnej mapy</button>
</div>
<main id="editors" aria-label="Obszar roboczy"></main>
<div id="tab-error" role="alert" hidden></div>
</body>
</html>
