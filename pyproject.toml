[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geostudio-pl"
version = "0.14.0"
description = "Experimental desktop editor / viewer for GEO-MAP v8 textual files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "ezdxf>=1.2", "pyproj>=3.6"]

[project.optional-dependencies]
geo = ["pyproj>=3.6"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
geostudio-inspect = "geostudio.inspect:main"
geostudio = "geostudio.app:main"

[tool.setuptools.packages.find]
include = ["geostudio*"]
