[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geostudio-pl"
version = "2.0.42"
description = "Experimental desktop editor / viewer for GEO-MAP v8 textual files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "ezdxf>=1.2", "pyproj>=3.6"]

[project.optional-dependencies]
geo = ["pyproj>=3.6"]
dev = ["pytest>=8", "ruff>=0.8", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "shapely>=2.0", "Pillow>=10.0", "reportlab>=4.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "pywebview>=5.0", "shapely>=2.0", "Pillow>=10.0", "reportlab>=4.0"]

[project.scripts]
geostudio-inspect = "geostudio.inspect:main"
geostudio = "geostudio.app:main"

[tool.setuptools.packages.find]
include = ["geostudio*"]

[tool.setuptools.package-data]
"geostudio.web_app" = ["static/*.html", "static/*.css", "static/*.js"]
