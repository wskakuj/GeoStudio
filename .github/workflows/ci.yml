name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt and native auth UI shared libraries on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libdbus-1-3 xvfb xauth tk
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q geostudio
      - name: Validate offline Canvas JavaScript syntax
        run: node --check geostudio/web_app/static/map.js
      - name: Validate administrator UI JavaScript
        run: |
          node --check geostudio/web_app/static/admin.js
          node --check geostudio/web_app/static/tabs.js
      - name: Test offline permit signer and administrator gateway
        run: node --test firebase/worker/*.test.mjs
      - run: python -m pytest -q
      - name: Exercise actual Tk authentication windows with a virtual display
        timeout-minutes: 2
        run: timeout -k 5s 90s xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -vv -o faulthandler_timeout=30 tests/test_firebase_auth_ui.py
        env:
          GEOSTUDIO_REQUIRE_AUTH_UI_TEST: "1"
      - run: python -m pytest -q tests/test_gui.py
        env:
          QT_QPA_PLATFORM: offscreen
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated emulator test dependencies
        working-directory: firebase/rules-test
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify Firestore rules against local demo emulator
        working-directory: firebase/rules-test
        run: npm test
