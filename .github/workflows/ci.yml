name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt shared libraries on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libdbus-1-3
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q geostudio
      # Temporary verbose timeout for isolating a blocking GUI test.
      - run: timeout 100s python -u -m pytest -vv -s --tb=short
      - run: python -m pytest -q tests/test_gui.py
        env:
          QT_QPA_PLATFORM: offscreen
