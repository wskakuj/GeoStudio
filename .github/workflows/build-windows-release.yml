name: Build GeoStudio Windows release from selected ref

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to package
        required: true
        default: main
        type: string
      release_tag:
        description: GitHub release tag (np. v2.0.0)
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected GeoStudio version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Record exact source commit
        id: source
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source version and unused release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          python tools/windows/check_release.py $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Selected source and release tag do not match." }
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify release tag." }
          if ($existing) { throw "Release tag already exists. Use a new version; do not reuse a published tag." }
      - name: Install Inno Setup 6 if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
      - name: Build and smoke-check installer
        id: installer
        timeout-minutes: 20
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          ./tools/windows/build.ps1
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = & ./tools/windows/check_installer.ps1 -Version $version
          "path=dist/installer/$($installer.Name)" >> $env:GITHUB_OUTPUT
      - name: Publish prerelease and attach installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: GeoStudio 2.0 · ${{ inputs.release_tag }}
          body: |
            Wstępne wydanie instalatora GeoStudio 2.0 dla Windows.

            Źródło: `${{ inputs.source_ref }}` (`${{ steps.source.outputs.sha }}`).
            Instalator tworzy instalację dla bieżącego użytkownika.
          prerelease: false
          files: ${{ steps.installer.outputs.path }}
          fail_on_unmatched_files: true
