name: Windows GeoStudio2 preview installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/windows/**"
      - "geostudio/web_app/**"
      - "geostudio/geomap.py"
      - "pyproject.toml"
      - ".github/workflows/windows-preview.yml"

# New draft revisions invalidate obsolete installer binaries.
concurrency:
  group: windows-geostudio2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build authenticated portable preview (manual main run)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GEOSTUDIO_FIREBASE_PROJECT_ID: ${{ secrets.GEOSTUDIO_FIREBASE_PROJECT_ID }}
          GEOSTUDIO_FIREBASE_WEB_API_KEY: ${{ secrets.GEOSTUDIO_FIREBASE_WEB_API_KEY }}
          GEOSTUDIO_OFFLINE_URL: ${{ secrets.GEOSTUDIO_OFFLINE_URL }}
          GEOSTUDIO_OFFLINE_PUBLIC_KEY: ${{ secrets.GEOSTUDIO_OFFLINE_PUBLIC_KEY }}
          GEOSTUDIO_ADMIN_URL: ${{ secrets.GEOSTUDIO_ADMIN_URL }}
        shell: pwsh
        run: ./tools/windows/build.ps1 -SkipInstaller -RequireFirebaseConfig
      - name: Build locked diagnostic preview (no Firebase configuration)
        if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        shell: pwsh
        run: ./tools/windows/build.ps1 -SkipInstaller
      - name: Upload authenticated portable preview
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GeoStudio2-Firebase-Test-portable-x64
          path: dist/GeoStudio2/
          if-no-files-found: error
          retention-days: 7
