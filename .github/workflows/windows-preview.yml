name: Windows GeoStudio2 preview installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/windows/**"
      - "geostudio/web_app/**"
      - "geostudio/geomap.py"
      - "pyproject.toml"
      - ".github/workflows/windows-preview.yml"

# New draft revisions invalidate obsolete installer binaries.
concurrency:
  group: windows-geostudio2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    # A healthy build takes ~4 minutes; 40 leaves room for a cold pip cache
    # without burning an hour when something really is stuck.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup 6 only if missing
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
      - name: Build Windows EXE and per-user installer
        shell: pwsh
        run: ./tools/windows/build.ps1
      - name: Check installer output
        shell: pwsh
        run: |
          $version = python -c "from geostudio import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read source version." }
          $version = $version.Trim()
          python tools/windows/check_release.py "v$version"
          if ($LASTEXITCODE -ne 0) { throw "Source versions do not match." }
          $installer = & ./tools/windows/check_installer.ps1 -Version $version
          Write-Host "Installer validated: $($installer.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: GeoStudio2-Setup-x64
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: GeoStudio2-portable-x64
          path: dist/GeoStudio2/
          if-no-files-found: error
          retention-days: 14
